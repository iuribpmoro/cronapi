services:
  - type: web
    name: cronapi
    env: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cronapi-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_INDIE_PRICE_ID
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false

databases:
  - name: cronapi-db
    databaseName: cronapi
    user: cronapi
    plan: free
